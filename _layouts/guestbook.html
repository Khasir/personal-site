---
layout: default
---
<section class="guestbook" data-guestbook
     data-api-base="{{ site.comments_api_base }}">
  <h1>{{ page.title }}</h1>
  {{ content }}

  <form class="guestbook-form" data-guestbook-form>
    <div class="field">
      <label for="gb-name">Name</label>
      <input id="gb-name" name="name" type="text" maxlength="80" required>
    </div>
    <div class="field">
      <label for="gb-email">Email <span class="field-optional">(optional, shown publicly)</span></label>
      <input id="gb-email" name="email" type="email" maxlength="254">
    </div>
    <div class="field">
      <label for="gb-message">Message <span class="field-optional">(optional)</span></label>
      <textarea id="gb-message" name="message" maxlength="1000" rows="4"></textarea>
    </div>
    <!-- Honeypot field: real visitors never fill this in; bots usually do. -->
    <div class="field field--hidden" aria-hidden="true">
      <label for="gb-website">Website</label>
      <input id="gb-website" name="website" type="text" tabindex="-1" autocomplete="off">
    </div>
    <button type="submit">Sign the guestbook</button>
    <p class="form-status" data-guestbook-status role="status"></p>
  </form>

  <ol class="guestbook-entries" data-guestbook-entries>
    <li class="loading">Loading entries&hellip;</li>
  </ol>
</section>
