---
layout: default
---
<section class="entry-list-page">
  <h1>{{ page.title }}</h1>
  {{ content }}
  <ul class="entry-list">
    {% assign entries = site.notes | sort: "date" | reverse %}
    {% for entry in entries %}
    <li>
      <a href="{{ entry.url | relative_url }}">{{ entry.title }}</a>
      <time datetime="{{ entry.date | date_to_xmlschema }}">{{ entry.date | date: "%b %-d, %Y" }}</time>
      {% if entry.summary %}<p class="entry-summary">{{ entry.summary }}</p>{% endif %}
    </li>
    {% endfor %}
  </ul>
</section>
