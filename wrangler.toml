name = "personal-site"
compatibility_date = "2026-08-08"
pages_build_output_dir = "_site"

[[d1_databases]]
binding = "DB"
database_name = "personal-site-comments"
database_id = "REPLACE_ME"  # filled in after `npx wrangler d1 create personal-site-comments`

# Set locally with `npx wrangler pages secret put IP_HASH_SALT` for the
# deployed project, and in .dev.vars for local dev. Any random string works;
# it's just salt for hashing commenter IPs, never stored or sent anywhere.
