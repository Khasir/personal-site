<aside class="comments" data-comments data-api-base="{{ site.comments_api_base }}" data-post-slug="{{ page.slug | default: page.url }}">
  <p class="comments-hint" align="center"></p>

  <!-- comments.js moves this to just before .entry-content so keyboard users reach it before the body's links. -->
  <nav class="comment-nav" data-comment-nav aria-label="Comment navigator" hidden>
    <button type="button" class="comment-nav-label comment-nav-toggle" data-comment-nav-toggle aria-label="Comments" aria-expanded="true">Comments</button>
    <div class="comment-nav-text" aria-live="polite" aria-atomic="true">
      <p class="comment-nav-label" data-comment-nav-label>– of 0</p>
    </div>
    <div class="comment-nav-buttons">
      <button type="button" data-comment-nav-prev aria-label="Previous comment">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><path d="M3 10.5 8 5.5l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" data-comment-nav-next aria-label="Next comment">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><path d="M3 5.5 8 10.5l5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </nav>

  <div class="comment-popover" data-comment-popover hidden>
    <button type="button" class="comment-popover-trigger" data-comment-trigger>Comment</button>
  </div>

  <div class="comment-form-dialog" data-comment-form-dialog hidden>
    <form data-comment-form>
      <blockquote class="comment-form-quote" data-comment-form-quote></blockquote>
      <div class="field">
        <label for="comment-name">Name</label>
        <input id="comment-name" name="name" type="text" maxlength="80" required>
      </div>
      <div class="field">
        <label for="comment-body">Comment</label>
        <textarea id="comment-body" name="body" maxlength="1000" rows="3" required></textarea>
      </div>
      <!-- Honeypot field: real visitors never fill this in; bots usually do. -->
      <div class="field field--hidden" aria-hidden="true">
        <label for="comment-website">Website</label>
        <input id="comment-website" name="website" type="text" tabindex="-1" autocomplete="off">
      </div>
      <div class="comment-form-actions">
        <button type="submit">Post comment</button>
        <button type="button" data-comment-form-cancel>Cancel</button>
      </div>
      <p class="form-status" data-comment-form-status role="status"></p>
    </form>
  </div>

  <div class="comment-thread-popover" data-comment-thread-popover hidden>
    <ul data-comment-thread-list></ul>
    <div class="comment-thread-actions">
      <button type="button" data-comment-thread-reply>Reply</button>
      <button type="button" data-comment-thread-close>Close</button>
    </div>
  </div>
</aside>
